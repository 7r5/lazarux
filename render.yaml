envVarGroups:
  - name: database-vars
    envVars:
      - key: DATABASE_URL
        sync: false

services:
  - type: web
    name: ecommerce-frontend
    env: static
    rootDir: frontend
    staticPublishPath: dist
    buildCommand: npm ci && npm run build
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://ecommerce-backend-o8ad.onrender.com"

  - type: web
    name: ecommerce-backend
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    ignorePaths:
      - frontend/**
      - phpmyadmin/**
    envVars:
      - fromGroup: database-vars

  - type: web
    name: ecommerce-phpmyadmin
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: phpmyadmin/Dockerfile
    ignorePaths:
      - frontend/**
      - backend/**
    envVars:
      - fromGroup: database-vars
      - key: PMA_ABSOLUTE_URI
        value: "https://ecommerce-phpmyadmin.onrender.com"
      - key: PMA_UPLOAD_MAX_FILESIZE
        value: "64M"
      - key: PMA_POST_MAX_SIZE
        value: "64M"
      - key: PMA_MAX_ROWS
        value: "1000"
