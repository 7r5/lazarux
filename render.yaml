services:
  - type: web
    name: ecommerce-frontend
    env: static
    staticPublishPath: frontend/dist
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run preview -- --host 0.0.0.0 --port 10000
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://backend-ecommerce.onrender.com"

  - type: web
    name: ecommerce-backend
    env: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    # Use the existing backend/Dockerfile which pins Python to 3.12
    # Dockerfile will handle installing requirements and starting uvicorn
    # startCommand is unnecessary because Dockerfile CMD runs the server
    envVars:
      - key: DATABASE_URL
        value: "mysql+pymysql://avnadmin:<PASSWORD>@lazarus-mysql-lazarus-mysql.e.aivencloud.com:19674/defaultdb?ssl-mode=REQUIRED"
