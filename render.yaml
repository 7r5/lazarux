envGroups:
  - name: database-vars
    envVars:
      - key: DATABASE_URL
        fromSecret: DATABASE_URL

services:
  - type: web
    name: ecommerce-frontend
    env: static
    staticPublishPath: frontend/dist
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run preview -- --host 0.0.0.0 --port 10000
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://ecommerce-backend-o8ad.onrender.com"

  - type: web
    name: ecommerce-backend
    env: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    # Use the existing backend/Dockerfile which pins Python to 3.12
    # Dockerfile will handle installing requirements and starting uvicorn
    # startCommand is unnecessary because Dockerfile CMD runs the server
    envGroups:
      - database-vars

  - type: web
    name: ecommerce-phpmyadmin
    env: docker
    plan: free
    dockerfilePath: phpmyadmin/Dockerfile
    envGroups:
      - database-vars
    envVars:
      - key: PMA_ABSOLUTE_URI
        value: "https://ecommerce-phpmyadmin.onrender.com"
      - key: PMA_UPLOAD_MAX_FILESIZE
        value: "64M"
      - key: PMA_POST_MAX_SIZE
        value: "64M"
      - key: PMA_MAX_ROWS
        value: "1000"
